<!DOCTYPE html>
<html>
  <body>
    <script>
      // Tiny Streamlit component that reads / writes / clears ONE cookie inside the browser
      // and reports back to Python. (Streamlit Cloud does not reliably pass JS-set cookies
      // to the server, and st.components.v1.html no longer exists, so this does both jobs.)
      // Uses Streamlit's plain postMessage protocol, no libraries.
      (function () {
        var lastNonce = null;

        function post(type, extra) {
          var message = { isStreamlitMessage: true, type: type };
          for (var key in extra) { message[key] = extra[key]; }
          window.parent.postMessage(message, "*");
        }

        function getCookie(name) {
          var parts = document.cookie ? document.cookie.split(";") : [];
          for (var i = 0; i < parts.length; i++) {
            var item = parts[i].replace(/^\s+/, "");
            if (item.indexOf(name + "=") === 0) {
              return decodeURIComponent(item.substring(name.length + 1));
            }
          }
          return "";
        }

        function setCookie(name, value, maxAge) {
          var secure = window.location.protocol === "https:" ? "; Secure" : "";
          document.cookie = name + "=" + encodeURIComponent(value) +
            "; max-age=" + maxAge + "; path=/; SameSite=Lax" + secure;
        }

        window.addEventListener("message", function (event) {
          var data = event.data;
          if (!data || data.type !== "streamlit:render") { return; }
          var args = data.args || {};
          var nonce = args.nonce || "";
          if (nonce === lastNonce) { return; }          // each request is handled once
          lastNonce = nonce;

          var action = args.action || "get";
          var name = args.name || "";
          var wanted = args.value || "";

          if (action === "set") { setCookie(name, wanted, args.max_age || 0); }
          else if (action === "clear") { setCookie(name, "", 0); }

          var value = getCookie(name);
          var ok = true;
          if (action === "set") { ok = (value === wanted); }
          if (action === "clear") { ok = (value === ""); }

          post("streamlit:setComponentValue", {
            value: { value: value, nonce: nonce, action: action, ok: ok },
            dataType: "json"
          });
        });

        post("streamlit:componentReady", { apiVersion: 1 });
        post("streamlit:setFrameHeight", { height: 0 });
      })();
    </script>
  </body>
</html>
